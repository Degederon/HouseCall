send:
  fields:
    message:
      required: true
      example: "Water under the kitchen sink!"
      selector:
        text:
    title:
      required: false
      selector:
        text:
    to:
      required: false
      example: "everyone"
      selector:
        text:
    priority:
      required: false
      default: normal
      selector:
        select:
          translation_key: priority
          options:
            - info
            - normal
            - critical
acknowledge:
  fields:
    id:
      required: true
      selector:
        text:
    by:
      required: false
      selector:
        text:
clear_history:
send_test:
  fields:
    to:
      required: true
      example: "Grandma"
      selector:
        text:
    how:
      required: false
      default: all
      selector:
        select:
          translation_key: test_how
          options:
            - all
            - app
            - messaging
